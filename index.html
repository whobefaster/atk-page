<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>ATK-HL-STATUS</title></head>
<body><pre id="out">HL-ST-START</pre>
<script>
try {
  // GET get_status с ключом Hyperliquid и случайным UUID
  var xhr = new XMLHttpRequest();
  xhr.open("GET", "https://widget.swapped.com/api/v1/merchant/get_status?apiKey=pk_live_5cf10a0d2c6fffd8e92c8ee633b69b02&order_id=c44a8091-0017-4010-8652-0e3b5561cf68", false);
  xhr.send();
  document.title = "HL-ST-" + xhr.status;
  document.getElementById("out").textContent = "HL-ST-RESULT " + xhr.status + " :: " + xhr.responseText.slice(0, 500);
} catch (e) {
  document.title = "HL-ST-ERR";
  document.getElementById("out").textContent = "HL-ST-ERR " + e.message;
}
</script></body></html>
